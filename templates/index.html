<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taskflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body data-page="landing" data-google="{{ google_client_id }}">
<main class="landing">
  <section class="hero">
    <div class="logo"><svg viewBox="0 0 24 24" width="28" height="28" fill="#2E7D32"><path d="M20 4C9 4 4 9 4 16c0 1.6.4 3 1 4 1-4 4-8 9-10-4 3-6 6-7 11 1 .6 2 1 3 1 8 0 10-8 10-18z"/></svg><span>Taskflow</span></div>
    <h1>Small steps make big progress.</h1>
    <p>Plan your day, track deadlines, and finish what matters. Taskflow keeps every task, priority, and due date in one calm place.</p>
  </section>
  <section class="card auth">
    <div class="tabs"><button class="tab active" data-mode="login">Log in</button><button class="tab" data-mode="signup">Sign up</button></div>
    <form id="auth-form" novalidate>
      <label class="signup-only" hidden>Full Name<input name="username" autocomplete="name" placeholder="e.g. Alex Morgan"></label>
      <label>Work Email<input name="email" type="email" autocomplete="email" required placeholder="name@company.com"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Minimum 8 characters"></label>
      
      <div class="signup-only form-field" hidden>
        <label for="signup-role">Role Persona</label>
        <select name="role" id="signup-role" class="auth-select">
          <option value="Employee">Employee (Software Engineer)</option>
          <option value="Lead">Team Lead</option>
          <option value="Admin">Admin (Engineering Manager)</option>
        </select>
      </div>

      <div class="signup-only form-field" id="signup-team-wrap" hidden>
        <label for="signup-team">Designated Team / Squad</label>
        <select name="team_id" id="signup-team" class="auth-select">
          <option value="">Select your Squad...</option>
          <option value="1">Frontend Squad</option>
          <option value="2">Backend Squad</option>
          <option value="3">Mobile Squad</option>
          <option value="4">QA Squad</option>
        </select>
      </div>

      <p id="auth-error" class="error" role="alert"></p>
      <button class="btn primary" id="auth-submit">Log in</button>
    </form>
    <div class="divider"><span>or</span></div>
    <div id="google-btn"></div>
    <button class="btn ghost" id="google-fallback" hidden>Continue with Google</button>
  </section>
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
